services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rls_demo
      POSTGRES_USER: rls_admin
      POSTGRES_PASSWORD: spike_admin_password
    ports:
      - "55432:5432"
    volumes:
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rls_admin -d rls_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
