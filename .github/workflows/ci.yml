name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e dependências (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar dependências travadas
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: mypy
        run: uv run --frozen mypy domain application contracts

      - name: Testes com cobertura
        run: uv run --frozen pytest -q --cov --cov-report=term-missing

      - name: Auditoria de dependências
        run: uv run --frozen pip-audit

  gitleaks:
    name: Varredura de segredos (histórico Git)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do histórico completo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27"
          cache: false

      - name: Instalar Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Examinar arquivos e histórico
        run: gitleaks detect --source . --log-opts="--all" --redact --exit-code 1
